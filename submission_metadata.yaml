ai_usage_summary: |
  Used Claude (opencode agent) for end-to-end development, architecture design,
  code generation, debugging, and documentation.

methodology_summary: |
  Five-phase pipeline: (1) Calibration scans candidate data distributions and
  decomposes the JD into skill clusters. (2) Hard filters via honeypot checks,
  behavioural gates, four-tier archetype scoring, and experience band. (3) Deep
  scoring: pre-filters top 2000 by fast non-semantic scores, then computes 5
  components — semantic (per-role BAAI/bge-small-en-v1.5 embeddings with JD
  cosine similarity), technical (relevance x proficiency x duration x endorsements),
  founding fit (startup ratio, scope breadth, career velocity), behavioural
  (23-signal composite with EDA-corrections), and career quality (product-company
  ratio, progression arc, tenure). (4) Reranks top 500 to final 100 with
  diversity penalty for same-company clusters. (5) Generates recruiter-facing
  reasoning via OpenRouter API with template fallback.

declarations:
  read_submission_spec: true
  code_is_original_work: true
